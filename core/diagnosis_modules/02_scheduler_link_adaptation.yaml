version: "2.0.0"
module_id: "MOD_SCHEDULER_LINK_ADAPTATION"
module_name: "스케줄러 및 링크 적응 통합 진단 모듈"
category: "SCHEDULER_LINK_ADAPTATION"
targeting:
  network_mode: ["ALL"]
  active_vendor: ["ALL"]
  call_phase: ["DL_Traffic"]

rules:
  - id: "DIAG_S_01"
    name: "우수 RF 환경 대비 낮은 변조 지수 (Low Modulation in High SINR)"
    severity: "MEDIUM"
    detection:
      target_source: "QC_KPI"
      condition: "Serving SS-SINR >= 22.0 dB and DL MCS < 16.0"
      phase: "DL_Traffic"
    analysis:
      root_cause: "기지국 OLLA(Outer Loop Link Adaptation) 페널티 과다 누적으로 인한 변조 차수(MCS) 강제 억압"
      correlation_fields:
        - "[Call & 5G KPI PCell RF Serving SS-SINR [dB]]"
        - "[Call & 5G KPI PCell Layer1 DL MCS (Avg)]"
        - "[Call & 5G KPI PCell Layer1 DL Modulation0 DL 256 QAM Rate [%]]"
        - "[Call & 5G KPI PCell Layer1 DL BLER [%]]"
    improvement:
      parameter: "olla-TargetBler"
      recommended_action: "OLLA Target BLER을 10%로 타이트하게 수렴 및 페널티 Step 회복 속도 상향"
      vendor_specific:
        nokia: "set OLLA_PARAM targetBler=10, stepUp=0.1"
        samsung: "MOD NROLLA: TargetBler=10, StepUp=1"
        ericsson: "set OllaConfig targetBler=10"

  - id: "DIAG_S_02"
    name: "우수 RF 환경 고에러율 (High BLER in High SINR)"
    severity: "HIGH"
    detection:
      target_source: "QC_KPI"
      condition: "Serving SS-SINR >= 20.0 dB and PDSCH BLER > 15.0%"
      phase: "DL_Traffic"
    analysis:
      root_cause: "단말 CQI 오보고로 인한 과도한 MCS 할당 또는 인접 셀(Neighbor PCI)과의 순간 위상 간섭"
      correlation_fields:
        - "[Call & 5G KPI PCell RF Serving SS-SINR [dB]]"
        - "[Call & 5G KPI PCell Layer1 DL BLER [%]]"
        - "[Neighbor Top1 SS-RSRP]"
        - "[Call & 5G KPI PCell RF CQI]"
    improvement:
      parameter: "csi-ReportConfig"
      recommended_action: "단말 CQI 보고 주기 단축 및 OLLA 마진 완화"
      vendor_specific:
        nokia: "set CSI_REPORT period=sl10"
        samsung: "MOD NRCSI: ReportPeriod=10"
        ericsson: "set CsiReporting period=sl10"

  - id: "DIAG_S_03"
    name: "CQI-MCS 미스매치 (CQI-to-MCS Divergence)"
    severity: "MEDIUM"
    detection:
      target_source: "QC_KPI"
      condition: "abs(CQI - DL_MCS/1.8) > 4.0 for > 3 consecutive seconds"
      phase: "DL_Traffic"
    analysis:
      root_cause: "단말 채널 상태 보고와 기지국 MCS 스케줄러 간 시차(Latency) 지연 및 링크 적응 불안정"
      correlation_fields:
        - "[Call & 5G KPI PCell RF CQI]"
        - "[Call & 5G KPI PCell Layer1 DL MCS (Avg)]"
        - "[Call & 5G KPI PCell RF Serving SS-RSRP [dBm]]"
    improvement:
      parameter: "linkAdaptationDelay"
      recommended_action: "기지국 링크 적응 필터 가중치(Alpha) 최적화"
      vendor_specific:
        nokia: "set LA_CONFIG laFilterWeight=0.8"
        samsung: "MOD NRLINKADAPT: FilterAlpha=80"
        ericsson: "set LinkAdaptation filterWeight=0.8"

  - id: "DIAG_S_05"
    name: "단기 RI 랭크 요동 (Rapid RI Oscillation)"
    severity: "MEDIUM"
    detection:
      target_source: "QC_KPI"
      condition: "RI changes between 4 and 1 >= 3 times within 2 seconds"
      phase: "DL_Traffic"
    analysis:
      root_cause: "기지국 빔포밍 트래킹 실패 및 CSI-RS 다중경로 위상 급변"
      correlation_fields:
        - "[Call & 5G KPI PCell Layer1 RI(Mode)]"
        - "[Call & 5G KPI PCell Layer1 DL Layer Num]"
        - "[Call & 5G KPI PCell RF Serving SS-SINR [dB]]"
    improvement:
      parameter: "ri-ReportingPeriodicity"
      recommended_action: "RI 피드백 주기 및 랭크 히스테리시스 필터링 적용"
      vendor_specific:
        nokia: "set CSI_REPORT riPeriodicity=sl20, riHysteresis=1"
        samsung: "MOD NRCSI: RiPeriod=20, RiHyst=1"
        ericsson: "set CsiReporting riPeriod=sl20"

  - id: "DIAG_S_06"
    name: "CQI Table 1/2 핑퐁 (CQI Table Switching Flapping)"
    severity: "LOW"
    detection:
      target_source: "QC_KPI, L3_MSG"
      condition: "256QAM Rate oscillations between 0% and 100% >= 4 times"
      phase: "DL_Traffic"
    analysis:
      root_cause: "64QAM(Table 1)과 256QAM(Table 2) 간의 전환 임계치 부근에서 잦은 스위칭 핑퐁 발생"
      correlation_fields:
        - "[Call & 5G KPI PCell Layer1 DL Modulation0 DL 256 QAM Rate [%]]"
        - "[Call & 5G KPI PCell RF Serving SS-SINR [dB]]"
    improvement:
      parameter: "cqi-Table-Switching-Hysteresis"
      recommended_action: "256QAM 진입/이탈 SINR 히스테리시스 2dB 확장"
      vendor_specific:
        nokia: "set CQI_TABLE_CONFIG hystSinr=2.0"
        samsung: "MOD NRCQITBL: HystSinr=20"
        ericsson: "set CqiTableConfig hystSinr=2.0"

  - id: "DIAG_S_07"
    name: "320-슬롯 SLIV 심볼 억압 (320-Slot SLIV Symbol Suppression)"
    severity: "MEDIUM"
    detection:
      target_source: "320_SLIV_DURATION_MATRIX, MAC_DL_DCI"
      condition: "SLIV Duration <= 8 symbols in specific slots in 320-slot grid"
      phase: "DL_Traffic"
    analysis:
      root_cause: "특정 슬롯의 CORESET/PDCCH 자원 과다 점유로 PDSCH 데이터 심볼이 8개 이하로 억압"
      correlation_fields: ["SLIV Duration", "DL DCI Start Symbol", "Frame_Offset"]
    improvement:
      parameter: "coreset-Duration"
      recommended_action: "해당 슬롯의 CORESET #1 Duration을 1심볼로 축소하여 PDSCH 데이터 영역 확보"
      vendor_specific:
        nokia: "set CORESET_CONFIG coresetDuration=1"
        samsung: "MOD NRCORESET: Duration=1"
        ericsson: "set CoresetConfig duration=1"
