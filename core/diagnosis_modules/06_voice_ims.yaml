domain: "06_voice_ims"
domain_name: "VoLTE / VoNR 음성 품질 및 IMS 세션 분석"
version: "3.0.0"

causal_incident_tracing:
  enabled: true
  time_window_sec: 15.0
  fsi_scoring:
    weights:
      call_drop: 100.0
      audio_mute: 70.0
      setup_failure: 80.0
      jitter_surge: 30.0
  causal_fragments:
    user_impact: "하향 음성 RTP 패킷 수신이 중단되어 {mute_sec:.1f}초간 통화 묵음(Audio Mute) 발생"
    termination: "단말에서 세션 종료 요청(SIP BYE Tx)을 송신하여 VoLTE 통화 강제 비정상 절단"

rules:
  # ===========================================================================
  # [DIAG_V_01] 음성 호 수립 실패 (Call Setup Failure)
  # ===========================================================================
  - id: "DIAG_V_01_SETUP_FAIL"
    name: "VoLTE / VoNR 음성 호 수립 실패 (Call Setup Failure)"
    phase: "CALL_SETUP"
    target_rat: ["LTE", "NR"]
    network_mode: ["LTE", "NSA", "SA"]
    severity_default: "치명"
    detection:
      target_source: "EVENT_DETAIL, L3_MSG, SIP"
      condition: "SIP INVITE sent but received SIP 4xx/5xx/6xx Error response, or RRC Connection Request (highPriorityAccess) rejected/timed out"
    thresholds:
      setup_timeout_sec: 8.0
    severity_levels:
      HIGH: "SIP 호 수립 실패 및 망 거절 응답 수신"
    correlation_fields:
      - "[TIME_STAMP]"
      - "[Call & AutoCallSummary Call result]"
      - "[Call & Voice Call Event Detail Code1]"
    badge_template: "🚨 [{time}] {rat} 호 수립 실패 (Setup Fail)"

  # ===========================================================================
  # [DIAG_V_02] VoLTE / VoNR 호 비정상 절단 (RTP Drop - Bye)
  # ===========================================================================
  - id: "DIAG_V_02_RTP_DROP"
    name: "VoLTE / VoNR 음성 호 비정상 절단 (RTP Drop - Bye)"
    phase: "IN_CALL"
    target_rat: ["LTE", "NR"]
    network_mode: ["LTE", "NSA", "SA"]
    severity_default: "치명"
    detection:
      target_source: "EVENT_DETAIL, RTP, L3_MSG"
      condition: "AutoCallSummary Status is Drop with Detail Code 'RTP Drop - Bye', followed by forced SIP BYE Tx after downlink audio packet starvation"
    thresholds:
      consecutive_loss_time_ms: 3000.0
    severity_levels:
      HIGH: "하향 패킷 유실 및 기지국 RRE 거절로 인한 단말 IMS 강제 BYE 절단"
    correlation_fields:
      - "[Call & AutoCallSummary Detail Code1]"
      - "[Call & Voice Call Event Info]"
      - "[Call & Audio Rx Packet Loss (%)]"
      - "[Call & Audio Rx Packet Loss Time (ms)]"
    badge_template: "🚨 [{time}] {rat} 호 비정상 절단 (RTP Drop - Bye)"

  # ===========================================================================
  # [DIAG_V_03] 통화 묵음 및 음성 끊김 (Audio Mute / Speech Interruption)
  # ===========================================================================
  - id: "DIAG_V_03_AUDIO_MUTE"
    name: "VoLTE / VoNR 극심한 통화 묵음 (Audio Mute)"
    phase: "IN_CALL"
    target_rat: ["LTE", "NR"]
    network_mode: ["LTE", "NSA", "SA"]
    severity_default: "경고"
    detection:
      target_source: "RTP, Fav_RTP"
      condition: "Audio Rx Packet Loss Time >= 2000.0ms or Rx Packet Loss Rate >= 50%"
    thresholds:
      mute_duration_ms: 2000.0
      loss_rate_percent: 50.0
    severity_levels:
      HIGH: "묵음 지속 시간 >= 5.0초 (극심한 통화 먹통)"
      MED: "2.0초 <= 묵음 지속 시간 < 5.0초 (체감 음성 끊김)"
    correlation_fields:
      - "[TIME_STAMP]"
      - "[Call & Audio Rx Packet Loss Time (ms)]"
      - "[Call & Audio Rx Packet Loss (%)]"
      - "[Call & Audio Rx Packet Loss Count]"
    badge_template: "⚠️ [{time}] {rat} 통화 묵음 ({dur_sec}초간 RTP {loss_pct}% 유실)"

  # ===========================================================================
  # [DIAG_V_04] RTP 지터 과다 및 실시간 패킷 손실 (Jitter Surge)
  # ===========================================================================
  - id: "DIAG_V_04_JITTER_LOSS"
    name: "VoLTE / VoNR RTP 지터 급증 및 패킷 지연 (Jitter Surge)"
    phase: "IN_CALL"
    target_rat: ["LTE", "NR"]
    network_mode: ["LTE", "NSA", "SA"]
    severity_default: "주의"
    detection:
      target_source: "RTP, Fav_RTP"
      condition: "Audio Rx Jitter >= 80.0ms or Interarrival Jitter >= 150.0ms"
    thresholds:
      jitter_threshold_ms: 80.0
    severity_levels:
      MED: "지터 >= 80.0ms (MOS 저하 및 로봇 음성 발발)"
      LOW: "50.0ms <= 지터 < 80.0ms"
    correlation_fields:
      - "[Call & Audio Rx Jitter (ms)]"
      - "[Call & Audio Rx Interarrival Packet Jitter]"
    badge_template: "⚠️ [{time}] {rat} 지터 급증 (Jitter {jitter_ms}ms)"
